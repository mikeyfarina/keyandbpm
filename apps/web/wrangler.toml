name = "keyandbpm"
compatibility_date = "2026-09-01"

# Static hosting on Workers: no server code, the whole site is uploaded as assets.
[assets]
directory = "./dist"
not_found_handling = "404-page"

# The site's real address. Both hostnames serve the same assets; the canonical tag in
# index.html points at the apex, so search engines treat them as one page.
[[routes]]
pattern = "whatkeyandbpm.com"
custom_domain = true

[[routes]]
pattern = "www.whatkeyandbpm.com"
custom_domain = true
