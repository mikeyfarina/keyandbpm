name = "keyandbpm"
compatibility_date = "2026-09-01"

# Static hosting on Workers: no server code, the whole site is uploaded as assets.
[assets]
directory = "./dist"
not_found_handling = "404-page"

# Keep the workers.dev address serving. It is the canonical URL in index.html and the
# only hostname answering until the custom domain is attached.
workers_dev = true

# whatkeyandbpm.com cannot be attached while the zone still holds the DNS records that
# were imported from the previous registrar: Workers refuses to overwrite records it did
# not create. Delete the apex and www records in the Cloudflare dashboard, then restore:
#
# [[routes]]
# pattern = "whatkeyandbpm.com"
# custom_domain = true
#
# [[routes]]
# pattern = "www.whatkeyandbpm.com"
# custom_domain = true
