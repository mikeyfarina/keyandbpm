name = "keyandbpm"
compatibility_date = "2026-09-01"

# Keep the workers.dev address serving alongside the real domain, so a failed trigger
# update can never leave the worker with no hostname. This must stay above [assets]:
# a bare key after a table header belongs to that table, not to the top level.
workers_dev = true

# Static hosting on Workers: no server code, the whole site is uploaded as assets.
[assets]
directory = "./dist"
not_found_handling = "404-page"

# Both hostnames serve the same assets. The canonical tag in index.html names one of
# them, so search engines treat them as a single page rather than duplicates.
[[routes]]
pattern = "whatkeyandbpm.com"
custom_domain = true

[[routes]]
pattern = "www.whatkeyandbpm.com"
custom_domain = true
